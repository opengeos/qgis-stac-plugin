name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install black flake8 codespell

      - name: Check formatting with black
        run: black --check .

      - name: Lint with flake8
        run: flake8 stac_explorer/ --max-line-length=120 --ignore=E501,W503

      - name: Check spelling with codespell
        run: codespell stac_explorer/ --ignore-words-list="aci,acount,acounts,fallow,ges,hart,hist,nd,ned,ois,wqs,watermask,tre,mape" --skip="*.csv,*.geojson,*.json,*.yml,*.js,*.html,*.cff,*.pdf,*.svg"
