name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package plugin
        run: python package_plugin.py --no-verify

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: stac_explorer-*.zip
          generate_release_notes: true
